{% extends "base.html" %}

{% load static %}

{% block title %}
Login
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}

<div class="login-card">

<h1>Login</h1>

<p>Use your AGC ERP credentials.</p>

{% if error %}
<div class="error">

{{ error }}

</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="studentid"
placeholder="Student ID"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>

Calculate Attendance

</button>

</form>

</div>

{% endblock %}
